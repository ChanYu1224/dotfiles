# --- 色の設定 (256色) ---
# 基本的な256色端末設定
set -g default-terminal "screen-256color"
# RGBカラー（True Color）のサポートを追加（お使いのターミナルによる）
set -ag terminal-overrides ",xterm-256color:RGB"

# --- ステータスバーの設定 ---
# 表示位置を上部に
set -g status-position top

# 更新間隔を5秒に
set -g status-interval 5

# ウィンドウ番号を1始まりに
set -g base-index 1
setw -g pane-base-index 1

# ステータスバー全体: ダークグレー基調
set -g status-style bg=colour236,fg=colour252

# 左側: セッション名を水色背景で表示
set -g status-left-length 20
set -g status-left "#[bg=colour117,fg=colour235,bold] ❐ #S #[bg=colour236,fg=colour117] "

# 右側: 時刻と日付を水色アクセントで表示
set -g status-right-length 30
set -g status-right "#[fg=colour117]  %H:%M #[fg=colour243]│#[fg=colour117] %m/%d "

# --- ウィンドウタブの見た目 ---
# 非アクティブウィンドウ: 暗い背景にグレー文字
setw -g window-status-format "#[fg=colour243] #I:#W "

# アクティブウィンドウ: 水色背景に黒文字で強調
setw -g window-status-current-format "#[bg=colour117,fg=colour235,bold] #I:#W "

# ウィンドウ番号の自動振り直し
set -g renumber-windows on

# --- ペインボーダー ---
# 非アクティブペイン: 暗いグレー
set -g pane-border-style fg=colour238

# アクティブペイン: 水色ボーダー
set -g pane-active-border-style fg=colour117

# --- メッセージ表示 ---
set -g message-style bg=colour117,fg=colour235,bold

# --- マウス設定 ---
# マウス操作を有効化（選択、リサイズ、ペイン切り替え、スクロール）
set -g mouse on

# ダブルクリックで単語選択＋コピー
bind -T copy-mode    DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 "" \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 "" \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind -n DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word \; run-shell -d 0.3 "" \; send-keys -X copy-pipe-and-cancel "pbcopy"

# トリプルクリックで行選択＋コピー
bind -T copy-mode    TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 "" \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 "" \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind -n TripleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-line \; run-shell -d 0.3 "" \; send-keys -X copy-pipe-and-cancel "pbcopy"

# ドラッグ選択解除時に自動コピー
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# 右クリックでペースト
bind -n MouseDown3Pane paste-buffer
bind -T copy-mode    MouseDown3Pane send-keys -X cancel \; paste-buffer
bind -T copy-mode-vi MouseDown3Pane send-keys -X cancel \; paste-buffer

# スクロールアップでコピーモード自動突入（vim等のアプリ内ではアプリにスクロールを渡す）
bind -n WheelUpPane if-shell -F "#{alternate_on}" "send-keys -M" "if-shell -F '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# スクロール速度調整（3行ずつ）
bind -T copy-mode    WheelUpPane   select-pane \; send-keys -X -N 3 scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send-keys -X -N 3 scroll-down
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 3 scroll-down

# 中クリックでペースト
bind -n MouseDown2Pane paste-buffer

# --- キーバインド設定 ---
# ペインの分割設定
# "-" で上下に分割 (Vertical split)
bind - split-window -v -c "#{pane_current_path}"

# "\" で左右に分割 (Horizontal split)
bind \\ split-window -h -c "#{pane_current_path}"
